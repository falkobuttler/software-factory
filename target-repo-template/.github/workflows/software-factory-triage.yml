name: Software Factory Triage

# Thin trigger file — copy this into any repo whose issues you want triaged.
# All logic lives in the factory repo; this file only sets the schedule.
#
# Trigger: nightly cron, or run manually from the Actions tab.
#
# Required secrets (set at repo or org level):
#   APP_ID          — ID of the GitHub App
#   APP_PRIVATE_KEY — Private key PEM of the GitHub App
#   ANTHROPIC_API_KEY — Anthropic API key

on:
  schedule:
    # 03:00 UTC nightly
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_issues:
        description: "Maximum number of issues to triage in this run"
        type: number
        required: false
        default: 10

jobs:
  triage:
    uses: YOUR_ORG/software-factory/.github/workflows/triage.yml@main
    with:
      target_repo: ${{ github.repository }}
      max_issues: ${{ inputs.max_issues || 10 }}
    secrets:
      APP_ID: ${{ secrets.APP_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
