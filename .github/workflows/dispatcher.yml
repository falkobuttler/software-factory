name: Software Factory Dispatcher

# Called by target repos via workflow_call.
# All pipeline logic lives here — target repos have a thin wrapper only.
# Trigger: add the "ai-factory" label to any issue.

on:
  workflow_call:
    inputs:
      event_name:
        description: "GitHub event name (issues or issue_comment)"
        type: string
        required: true
      event_action:
        description: "GitHub event action (labeled, created, etc.)"
        type: string
        required: true
      issue_number:
        description: "Issue number to work on"
        type: number
        required: true
      target_repo:
        description: "Target repository in owner/repo format"
        type: string
        required: true
      label_name:
        description: "Name of the label that was added (for issues.labeled events)"
        type: string
        required: false
        default: ""
      comment_body:
        description: "Body of the triggering comment (empty for non-comment events)"
        type: string
        required: false
        default: ""
      pr_number:
        description: "PR number when the event is PR-related (pull_request_review or issue_comment on a PR)"
        type: number
        required: false
        default: 0
      runner:
        description: "Runner label for the factory job (e.g. ubuntu-latest or self-hosted)"
        type: string
        required: false
        default: "ubuntu-latest"
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

env:
  TARGET_REPO: ${{ inputs.target_repo }}
  ISSUE_NUMBER: ${{ inputs.issue_number }}
  EVENT_NAME: ${{ inputs.event_name }}
  EVENT_ACTION: ${{ inputs.event_action }}
  LABEL_NAME: ${{ inputs.label_name }}
  COMMENT_BODY: ${{ inputs.comment_body }}
  EVENT_PR_NUMBER: ${{ inputs.pr_number }}

jobs:
  factory:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Parse target repo owner
        id: parse
        run: |
          TARGET_OWNER="$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)"
          echo "target_owner=$TARGET_OWNER" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v3
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.target_owner }}

      - name: Check out target repo (code to work on)
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          # Do not persist the short-lived App token as Git credentials on
          # self-hosted runners; subsequent Git commands use local SSH auth.
          # GitHub-hosted runners have no durable local credentials.
          persist-credentials: ${{ inputs.runner != 'self-hosted' }}
          fetch-depth: 0

      - name: Configure self-hosted Git authentication
        if: inputs.runner == 'self-hosted'
        # Keep the canonical HTTPS origin written by checkout so the next job
        # reuses this worktree. Git transparently uses durable SSH auth for all
        # fetches and pushes without making checkout discard the repository.
        run: git config --local url."git@github.com:".insteadOf "https://github.com/"

      # Referencing the factory as an action makes the runner download it under
      # _actions, outside the target worktree. This avoids a second checkout and
      # keeps factory files out of commits made by the implementation agent.
      - name: Locate factory runtime (scripts + prompts)
        id: factory-runtime
        uses: falkobuttler/software-factory@main

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install factory dependencies
        env:
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
        run: npm install --prefix "$FACTORY_DIR"

      # ── Stage 1: Route ────────────────────────────────────────────────────
      - name: Route
        id: route
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          WORK_DIR: ${{ github.workspace }}
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
        run: |
          chmod +x "$FACTORY_DIR"/scripts/*.sh
          bash "$FACTORY_DIR/scripts/route.sh"

      # ── Stage 2: Plan ─────────────────────────────────────────────────────
      - name: Plan
        id: plan
        if: |
          steps.route.outputs.action == 'plan' ||
          steps.route.outputs.action == 'resume-plan'
        # Skipped when resuming from implement/review/stuck — plan already exists in issue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
        run: bash "$FACTORY_DIR/scripts/plan.sh"

      # ── Stage 3: Implement ────────────────────────────────────────────────
      - name: Implement
        id: implement
        if: |
          steps.route.outputs.action == 'implement' ||
          (steps.plan.outcome == 'success' && steps.plan.outputs.has_questions != 'true')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash "$FACTORY_DIR/scripts/implement.sh"

      # ── Stage 4a: Address human PR feedback ──────────────────────────────
      - name: Address PR feedback
        id: address_pr_feedback
        if: steps.route.outputs.action == 'address-pr-feedback'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash "$FACTORY_DIR/scripts/address-pr-feedback.sh"

      # ── Stage 4b: Review cycle ────────────────────────────────────────────
      - name: Review cycle
        id: review
        if: |
          steps.route.outputs.action == 'review' ||
          (steps.implement.outcome == 'success' && steps.implement.outputs.stuck != 'true') ||
          steps.address_pr_feedback.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}
          FACTORY_DIR: ${{ steps.factory-runtime.outputs.factory_dir }}
          PR_NUMBER: ${{ steps.implement.outputs.pr_number || steps.address_pr_feedback.outputs.pr_number }}
          # When coming from address-pr-feedback, ISSUE_NUMBER in the global env is the PR number.
          # Override it with the actual issue number the script derived from the branch name.
          ISSUE_NUMBER: ${{ steps.address_pr_feedback.outputs.issue_number || inputs.issue_number }}
        run: bash "$FACTORY_DIR/scripts/review-cycle.sh"
