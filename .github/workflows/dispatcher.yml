name: Software Factory Dispatcher

# Called by target repos via workflow_call.
# All pipeline logic lives here — target repos have a thin wrapper only.
# Trigger: add the "ai-factory" label to any issue.

on:
  workflow_call:
    inputs:
      event_name:
        description: "GitHub event name (issues or issue_comment)"
        type: string
        required: true
      event_action:
        description: "GitHub event action (assigned, created, etc.)"
        type: string
        required: true
      issue_number:
        description: "Issue number to work on"
        type: number
        required: true
      target_repo:
        description: "Target repository in owner/repo format"
        type: string
        required: true
      label_name:
        description: "Name of the label that was added (for issues.labeled events)"
        type: string
        required: false
        default: ""
      comment_body:
        description: "Body of the triggering comment (empty for non-comment events)"
        type: string
        required: false
        default: ""
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
      ANTHROPIC_API_KEY:
        required: true

jobs:
  factory:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Parse target repo owner
        id: parse
        run: |
          TARGET_OWNER="$(echo "${{ inputs.target_repo }}" | cut -d'/' -f1)"
          echo "target_owner=$TARGET_OWNER" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ steps.parse.outputs.target_owner }}

      - name: Check out factory repo (scripts + prompts)
        uses: actions/checkout@v4
        with:
          repository: falkobuttler/software-factory
          ref: main
          path: factory

      - name: Check out target repo (code to work on)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run factory pipeline
        env:
          TARGET_REPO: ${{ inputs.target_repo }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EVENT_NAME: ${{ inputs.event_name }}
          EVENT_ACTION: ${{ inputs.event_action }}
          LABEL_NAME: ${{ inputs.label_name }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORK_DIR: ${{ github.workspace }}/target
          FACTORY_DIR: ${{ github.workspace }}/factory
        run: |
          chmod +x factory/scripts/pipeline.sh factory/scripts/state.sh
          bash factory/scripts/pipeline.sh
